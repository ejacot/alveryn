name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify application version
        run: |
          chmod +x scripts/check-version.sh
          scripts/check-version.sh

      - name: Verify tag and release commit
        run: |
          expected_tag="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)." >&2
            exit 1
          fi

          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Release tags must point to the current main commit." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Alveryn $GITHUB_REF_NAME" \
            --generate-notes \
            "${release_flags[@]}"
